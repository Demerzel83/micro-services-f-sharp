services:
    sqlserver:
        container_name: sqlInDocker
        image: mcr.microsoft.com/mssql/server:2022-latest
        environment:
          - MSSQL_SA_PASSWORD=MyVeryStrongPassword123!
          - ACCEPT_EULA=Y
        volumes:
          - sql_data:/home/node/app/db/sqlserver
        ports:
          - "1433:1433"
