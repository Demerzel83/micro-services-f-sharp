services:
  sqlserver:
      container_name: sqlInDocker
      image: mcr.microsoft.com/mssql/server:2022-latest
      environment:
          - MSSQL_SA_PASSWORD=MyVeryStrongPassword123!
          - ACCEPT_EULA=Y
      volumes:
          - sql_data:/home/node/app/db/sqlserver
      ports:
          - "1433:1433"
      networks:
        - app-network
  rabbitmq:
      container_name: rabbitInDocker
      image: rabbitmq:3-management
      environment:
        - RABBITMQ_DEFAULT_USER=guest
        - RABBITMQ_DEFAULT_PASS=guest
      volumes:
        - rabbitmq_data:/home/node/app/bus/rabbitmq
      ports:
        - "5672:5672"
        - "15672:15672" 
      networks:
        - app-network

  catalog-listener:
    depends_on: 
      - sqlserver
    image: ${DOCKER_REGISTRY-}cataloglistener
    build:
      context: .
      dockerfile: catalog-service/catalog-listener/Dockerfile
    networks:
      - app-network
  catalog-service-api:
    depends_on: 
      - sqlserver
    image: ${DOCKER_REGISTRY-}catalogserviceapi
    build:
      context: .
      dockerfile: catalog-service/api-v2/catalog-service-api/Dockerfile
    ports:
        - "5002:80"
        - "5003:80"
    networks:
      - app-network

volumes:
    sql_data:
    mongo_data:
    rabbitmq_data:
    
networks:
  app-network:
    driver: bridge